
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
  <title>Smart Recipe & Shopping Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Load Google Identity Services SDK directly for better reliability in web previews -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#636b2f',
            'background-dark': '#0f110c',
            'surface-dark': '#1a1d14',
            'accent-foreground': '#ffffff'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-top-padding: calc(env(safe-area-inset-top, 44px) + 1rem);
    }
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      background-color: #0f110c;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1;
    }
    @media print {
      .no-print { display: none !important; }
    }
    .header-safe-pt {
      padding-top: var(--safe-top-padding);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@19.2.3/",
    "react": "https://esm.sh/react@19.2.3",
    "react-dom/": "https://esm.sh/react-dom@19.2.3/",
    "react-dom": "https://esm.sh/react-dom@19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "@react-oauth/google": "https://esm.sh/@react-oauth/google@0.12.1?deps=react@19.2.3,react-dom@19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-dark text-slate-100 min-h-screen">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
