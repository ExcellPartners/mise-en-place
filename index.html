
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#636b2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
  <title>Smart Recipe & Shopping Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Load Google Identity Services SDK directly for better reliability in web previews -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#636b2f',
            'background-dark': '#0f110c',
            'surface-dark': '#1a1d14',
            'accent-foreground': '#ffffff'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-top-padding: calc(env(safe-area-inset-top, 44px) + 1rem);
    }
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      background-color: #0f110c;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1;
    }
    @media print {
      .no-print { display: none !important; }
    }
    .header-safe-pt {
      padding-top: var(--safe-top-padding);
    }

    /* Safe area variables — works on iPhone notch, Android, tablet */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    .header-safe-pt { padding-top: calc(var(--safe-top) + 1rem); }
    .nav-safe-pb    { padding-bottom: calc(var(--safe-bottom) + 0.75rem); }

    /* Screen transition animations — subtle, 200ms */
    @keyframes screenEnter {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes screenBack {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes screenFade {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen-enter { animation: screenEnter 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
    .screen-back  { animation: screenBack  0.20s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
    .screen-fade  { animation: screenFade  0.18s ease-out both; }

  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@19.2.3/",
    "react": "https://esm.sh/react@19.2.3",
    "react-dom/": "https://esm.sh/react-dom@19.2.3/",
    "react-dom": "https://esm.sh/react-dom@19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "@react-oauth/google": "https://esm.sh/@react-oauth/google@0.12.1?deps=react@19.2.3,react-dom@19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-dark text-slate-100 min-h-screen">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
