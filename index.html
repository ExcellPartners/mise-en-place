
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
  <title>Smart Recipe & Shopping Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Load Google Identity Services SDK directly for better reliability in web previews -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#636b2f',
            'background-dark': '#0f110c',
            'surface-dark': '#1a1d14',
            'accent-foreground': '#ffffff'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      /* Safe area for notch/status bar — works on iPhone, Android, tablet */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      /* Header padding: safe area + comfortable spacing */
      --safe-top-padding: calc(var(--safe-top) + 1rem);
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      height: 100%;
    }

    body {
      background-color: #0f110c;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      height: 100%;
      /* Extend background into safe areas on notched devices */
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    #root {
      height: 100%;
      min-height: 100dvh; /* dvh = dynamic viewport height, accounts for browser chrome */
    }

    /* Full-width on all devices — no black bars ever */
    #root > div {
      width: 100%;
      min-height: 100dvh;
    }

    /* On large screens (desktop), cap content width and center it like a centered app */
    @media (min-width: 1024px) {
      #root > div {
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 0 120px rgba(0,0,0,0.8);
      }
      body {
        background-color: #050705;
      }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1;
    }

    /* Safe area header — automatically handles notch on any device */
    .header-safe-pt {
      padding-top: var(--safe-top-padding);
    }

    /* Nav bar safe area — extends into home indicator area on iPhone */
    .nav-safe-pb {
      padding-bottom: calc(var(--safe-bottom) + 0.75rem);
    }

    /* Screen transitions */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-30%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .screen-enter {
      animation: slideInRight 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .screen-back {
      animation: slideInLeft 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .screen-fade {
      animation: fadeIn 0.22s ease-out both;
    }

    @media print {
      .no-print { display: none !important; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@19.2.3/",
    "react": "https://esm.sh/react@19.2.3",
    "react-dom/": "https://esm.sh/react-dom@19.2.3/",
    "react-dom": "https://esm.sh/react-dom@19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "@react-oauth/google": "https://esm.sh/@react-oauth/google@0.12.1?deps=react@19.2.3,react-dom@19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-dark text-slate-100 min-h-screen">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
